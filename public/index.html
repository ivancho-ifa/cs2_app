<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Deal Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e141b;
    --panel: #151e28;
    --panel-2: #1b2734;
    --edge: #263749;
    --text: #dbe4ee;
    --muted: #7e93a8;
    --gold: #cfa93c;
    --consumer: #b0c3d9;
    --milspec: #4b69ff;
    --restricted: #8847ff;
    --classified: #d32ce6;
    --covert: #eb4b4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(180deg, #16202c 0%, #101821 100%);
    border-bottom: 1px solid var(--edge);
    padding: 18px 24px 14px;
  }
  h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  h1 span { color: var(--gold); }
  #status {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 6px;
    color: var(--muted);
  }
  #status.live { color: #6ee26e; }
  #status.partial { color: var(--gold); }
  #status.down { color: var(--covert); }
  #status .age { opacity: 0.55; font-variant-numeric: tabular-nums; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .controls input[type="text"], .controls input[type="number"], .controls select {
    background: var(--panel-2);
    border: 1px solid var(--edge);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 3px;
  }
  .controls input[type="text"] { width: 220px; }
  .controls input[type="number"] { width: 90px; }
  .controls label.chk {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .controls input:focus, .controls select:focus { outline: 1px solid var(--gold); }
  #dir, #export {
    background: var(--panel-2);
    border: 1px solid var(--edge);
    color: var(--text);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 7px 12px;
    border-radius: 3px;
    cursor: pointer;
  }
  #export { text-decoration: none; }
  #dir:hover, #export:hover { border-color: var(--gold); color: var(--gold); }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
    padding: 20px 24px 40px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-top: 3px solid var(--tier, var(--edge));
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform .1s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .thumb {
    position: relative;
    height: 140px;
    background: radial-gradient(ellipse at center, #1d2a39 0%, #121b25 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .raritytag {
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    background: rgba(10, 16, 22, .75);
    border: 1px solid currentColor;
  }
  .thumb img { max-width: 90%; max-height: 130px; object-fit: contain; }
  .noimg {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #3d5166;
    border: 1px dashed #2a3a4c;
    padding: 8px 14px;
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    min-height: 2.7em;
  }
  .grade {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--tier);
  }
  .meter {
    height: 7px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3d5166 0%, var(--milspec) 22%, var(--restricted) 43%, var(--classified) 63%, var(--covert) 84%);
    position: relative;
  }
  .meter .pin {
    position: absolute;
    top: -4px;
    width: 3px;
    height: 15px;
    background: #fff;
    border-radius: 1px;
    box-shadow: 0 0 3px rgba(0,0,0,.8);
    transform: translateX(-50%);
  }
  .prices { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
  }
  .src { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .price-row a {
    color: var(--text);
    text-decoration: underline;
    text-decoration-color: #3d5166;
    text-underline-offset: 3px;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
  }
  .price-row a::after { content: ' \2197'; font-size: 10px; color: var(--muted); }
  .price-row a:hover { color: var(--gold); text-decoration-color: var(--gold); }
  .price-row.best a { color: #6ee26e; }
  .price-row.ref .src { color: #566d84; }
  .price-row.ref a { color: var(--muted); font-weight: 500; }
  .price-row.ref a:hover { color: var(--gold); }
  a.itemlink { color: inherit; text-decoration: none; display: block; }
  a.itemlink:hover .name { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
  .pop { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .pop .bars { display: flex; gap: 2px; }
  .pop .bars i {
    width: 9px;
    height: 8px;
    background: #2a3a4c;
    border-radius: 1px;
    transform: skewX(-12deg);
  }
  .pop .bars i.on { background: var(--gold); }
  .pop .lbl { font-family: 'Chakra Petch', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  .foot {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid var(--edge);
  }
  .discount { color: var(--tier); font-family: 'Chakra Petch', sans-serif; font-weight: 700; }
  #empty { padding: 60px 24px; text-align: center; color: var(--muted); display: none; }
  #more {
    display: none;
    margin: 0 auto 40px;
    padding: 12px 34px;
    background: var(--panel-2);
    border: 1px solid var(--edge);
    color: var(--text);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
  }
  #more:hover { border-color: var(--gold); color: var(--gold); }
  /* Any touch device: 16px inputs stop iOS focus-zoom (portrait and
     landscape alike), and links get roomier tap targets */
  @media (pointer: coarse) {
    .controls input[type="text"], .controls input[type="number"], .controls select {
      font-size: 16px;
      padding: 9px 10px;
    }
    .controls label.chk { padding: 6px 0; }
    .price-row a { padding: 6px 0 6px 16px; }
  }
  /* Narrow screens: tighter spacing, full-width search */
  @media (max-width: 640px) {
    header { padding: 14px 16px 12px; }
    .controls { padding: 10px 16px; gap: 8px; }
    .controls input[type="text"] { flex: 1 1 100%; width: auto; }
    .controls input[type="number"] { width: 104px; }
    #grid { padding: 14px 16px 28px; gap: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>CS2 <span>Deal Finder</span></h1>
  <div id="status">CONNECTING...</div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search skins...">
  <input type="number" id="minPrice" placeholder="Min $" min="0" step="0.01">
  <input type="number" id="maxPrice" placeholder="Max $" min="0" step="0.01">
  <label class="chk"><input type="checkbox" id="crossOnly"> Cross-listed only</label>
  <label class="chk"><input type="checkbox" id="imgOnly"> With images only</label>
  <select id="rarity">
    <option value="">All rarities</option>
  </select>
  <select id="type">
    <option value="">Any type</option>
    <option value="souvenir">Souvenir</option>
    <option value="stattrak">StatTrak&trade;</option>
    <option value="special">Knives and gloves</option>
    <option value="normal">Normal</option>
  </select>
  <select id="sort">
    <option value="discount">Sort: Discount</option>
    <option value="popularity">Sort: Popularity</option>
    <option value="spread">Sort: Cross-market spread</option>
    <option value="price">Sort: Price</option>
    <option value="rarity">Sort: Rarity</option>
  </select>
  <button id="dir" title="Flip sort direction" aria-label="Flip sort direction">&#8595; DESC</button>
  <a id="export" href="/api/export.csv" download title="Download every merged item with per-market prices">EXPORT CSV</a>
</div>

<div id="grid"></div>
<div id="empty">No deals match the current filters</div>
<button id="more">Show more</button>

<script>
const TIERS = [
  { min: 30, name: 'Covert', color: 'var(--covert)' },
  { min: 20, name: 'Classified', color: 'var(--classified)' },
  { min: 12, name: 'Restricted', color: 'var(--restricted)' },
  { min: 5,  name: 'Mil-Spec', color: 'var(--milspec)' },
  { min: 0,  name: 'Consumer', color: 'var(--consumer)' },
];
const SOURCE_LABEL = { dmarket: 'DMarket', skinport: 'Skinport', csfloat: 'CSFloat', marketcsgo: 'Market.CSGO' };
const POP_LABELS = ['Dead', 'Very low', 'Low', 'Moderate', 'High', 'Very high'];
// Canonical CS2 rarity order for the filter dropdown, unknown tiers follow alphabetically
const RARITY_ORDER = ['Contraband', 'Extraordinary', 'Covert', 'Classified', 'Restricted', 'Mil-Spec', 'Industrial', 'Consumer'];

function populateRarityFilter(counts) {
  const sel = document.getElementById('rarity');
  const current = sel.value;
  const present = counts || {};
  const names = Object.keys(present).sort((a, b) => {
    const ia = RARITY_ORDER.indexOf(a), ib = RARITY_ORDER.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
  sel.innerHTML = '<option value="">All rarities</option>' +
    names.map(n => `<option value="${esc(n)}">${esc(n)} (${present[n]})</option>`).join('');
  if (current && names.indexOf(current) !== -1) sel.value = current;
}
const METER_MAX = 40; // discount percent that pins the meter at the far end

let allItems = [];
const PAGE_SIZE = 96; // cards rendered per chunk, phones choke on thousands
let visibleCount = PAGE_SIZE;
let sortDir = 'desc'; // 'desc' = best first, flipped by the direction button

function tierFor(discount) {
  return TIERS.find(t => discount >= t.min) || TIERS[TIERS.length - 1];
}

function fmtUsd(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const min = parseFloat(document.getElementById('minPrice').value);
  const max = parseFloat(document.getElementById('maxPrice').value);
  const crossOnly = document.getElementById('crossOnly').checked;
  const imgOnly = document.getElementById('imgOnly').checked;
  const rarity = document.getElementById('rarity').value;
  const sort = document.getElementById('sort').value;

  let items = allItems.filter(it =>
    (!q || it.name.toLowerCase().includes(q)) &&
    (isNaN(min) || it.bestPrice >= min) &&
    (isNaN(max) || it.bestPrice <= max) &&
    (!crossOnly || it.crossListed) &&
    (!imgOnly || it.image) &&
    (!rarity || it.rarity === rarity)
  );

  // Each comparator sorts best-first, the direction button flips it
  const rarityIdx = (it) => {
    const i = it.rarity ? RARITY_ORDER.indexOf(it.rarity) : -1;
    return i === -1 ? RARITY_ORDER.length : i;
  };
  const cmp = {
    discount: (a, b) => b.discount - a.discount,
    popularity: (a, b) =>
      (b.popularity.score - a.popularity.score) ||
      ((b.popularity.volume7d || 0) - (a.popularity.volume7d || 0)) ||
      (b.discount - a.discount),
    spread: (a, b) => b.spread - a.spread,
    price: (a, b) => b.bestPrice - a.bestPrice,
    rarity: (a, b) => (rarityIdx(a) - rarityIdx(b)) || (b.discount - a.discount),
  }[sort];
  const flip = sortDir === 'asc' ? -1 : 1;
  items.sort((a, b) => flip * cmp(a, b));

  const grid = document.getElementById('grid');
  document.getElementById('empty').style.display = items.length ? 'none' : 'block';
  const shown = items.slice(0, visibleCount);
  const moreBtn = document.getElementById('more');
  moreBtn.style.display = items.length > shown.length ? 'block' : 'none';
  moreBtn.textContent = `Show more (${items.length - shown.length} hidden)`;
  grid.innerHTML = shown.map(it => {
    const tier = tierFor(it.discount);
    const pin = Math.min(it.discount / METER_MAX, 1) * 100;
    const rows = it.listings.map(l => `
      <div class="price-row ${l.source === it.bestSource ? 'best' : ''}">
        <span class="src">${SOURCE_LABEL[l.source] || esc(l.source)}</span>
        <a href="${esc(l.url)}" target="_blank" rel="noopener" title="Open this listing on ${SOURCE_LABEL[l.source] || esc(l.source)}">${fmtUsd(l.price)}</a>
      </div>`).join('')
      + (it.refs || []).map(r => `
      <div class="price-row ref">
        <span class="src">${esc(r.label)}</span>
        <a href="${esc(r.url)}" target="_blank" rel="noopener" title="Reference price, open on ${esc(r.label)}">${fmtUsd(r.price)}</a>
      </div>`).join('');
    const pop = it.popularity || { score: 0, basis: 'none' };
    const popBars = [1,2,3,4,5].map(i => `<i class="${i <= pop.score ? 'on' : ''}"></i>`).join('');
    const popText = pop.basis === 'sales'
      ? `${POP_LABELS[pop.score]} · ${pop.volume7d} sold in 7d`
      : pop.basis === 'listings'
      ? `${POP_LABELS[pop.score]} · ${pop.listings} listed`
      : 'No sales data';
    return `
    <div class="card" style="--tier:${tier.color}">
      <a class="itemlink" href="${esc(it.bestUrl)}" target="_blank" rel="noopener" title="Open the best priced listing">
        <div class="thumb">${it.image
          ? `<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy" decoding="async" onerror="this.outerHTML='<div class=\\'noimg\\'>NO PREVIEW</div>'">`
          : '<div class="noimg">NO PREVIEW</div>'}${it.rarity
          ? `<span class="raritytag" style="color:${esc(it.rarityColor || '#b0c3d9')}">${esc(it.rarity)}</span>`
          : ''}</div>
      </a>
      <div class="body">
        <div class="grade">${tier.name} Deal</div>
        <a class="itemlink" href="${esc(it.bestUrl)}" target="_blank" rel="noopener" title="Open the best priced listing">
          <div class="name">${esc(it.name)}</div>
        </a>
        <div class="meter"><div class="pin" style="left:${pin}%"></div></div>
        <div class="pop"><span class="bars">${popBars}</span><span class="lbl">${popText}</span></div>
        <div class="prices">${rows}</div>
        <div class="foot">
          <span class="discount">${it.discount.toFixed(1)}% off</span>
          <span>${it.float !== null && it.float !== undefined ? 'float ' + it.float.toFixed(4) : ''}</span>
          <span>${it.suggestedPrice > it.bestPrice ? (it.discountBasis === 'steam' ? 'vs Steam ' : 'vs highest ') + fmtUsd(it.suggestedPrice) : it.crossListed ? 'spread ' + fmtUsd(it.spread) : ''}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Age of a store's data as "42s", "3m 05s" or "1h 02m"
function fmtAge(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const pad = (v) => String(v).padStart(2, '0');
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${pad(s % 60)}s`;
  return `${Math.floor(s / 3600)}h ${pad(Math.floor(s / 60) % 60)}m`;
}

// Re-rendered every second so each store's data age keeps ticking
let statusData = null;
setInterval(() => { if (statusData) renderStatus(); }, 1000);

function setStatus(data) {
  // The server names its sources, so new ones need no frontend change
  for (const [k, s] of Object.entries(data.sources)) if (s.label) SOURCE_LABEL[k] = s.label;
  statusData = data;
  renderStatus();
}

function renderStatus() {
  const data = statusData;
  const el = document.getElementById('status');
  const enabled = Object.entries(data.sources).filter(([, s]) => s.enabled !== false);
  // "~" marks stores that do not date their data: age since the app fetched it
  const withAge = ([k, s]) => (s.asOf
    ? `${esc(SOURCE_LABEL[k] || k)} <span class="age">(${s.asOfBasis === 'fetched' ? '~' : ''}${fmtAge(Date.now() - Date.parse(s.asOf))})</span>`
    : esc(SOURCE_LABEL[k] || k));
  const up = enabled.filter(([, s]) => s.ok).map(withAge);
  const failed = enabled.filter(([, s]) => !s.ok && s.error);
  el.title = [
    'Time since each store last updated its prices. ~ means the store gives no timestamp, so it is the time since the app fetched it.',
    ...failed.map(([k, s]) => `${SOURCE_LABEL[k] || k}: ${s.error}`),
  ].join('\n');
  const n = data.totalBeforeCap > data.items.length
    ? `top ${data.items.length} of ${data.totalBeforeCap}`
    : data.items.length;
  const tag = data.mock ? 'MOCK DATA' : 'LIVE';
  // Labels and ages are escaped above, so the line can carry the age markup
  if (up.length === enabled.length && up.length > 0) {
    el.innerHTML = `${tag} - ${up.join(' + ')} | ${n} items`;
    el.className = data.mock ? 'partial' : 'live';
  } else if (up.length > 0) {
    el.innerHTML = `${tag} - ${up.join(' + ')} only | ${n} items`;
    el.className = 'partial';
  } else {
    el.textContent = 'OFFLINE - all sources failed, retrying in 60s';
    el.className = 'down';
  }
}

let retryTimer = null;
function retrySoon(ms) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(load, ms);
}

async function load() {
  const el = document.getElementById('status');
  const slowNote = setTimeout(() => {
    if (el.textContent.startsWith('CONNECTING')) {
      el.textContent = 'CONNECTING... first fetch pulls live market data and can take up to a minute';
    }
  }, 4000);
  // AbortController + setTimeout works on every browser, unlike AbortSignal.timeout
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const abortTimer = ctrl ? setTimeout(() => ctrl.abort(), 75000) : null;
  // Rarity and type filter on the server over the full merged list, so a
  // filtered view is as deep as the unfiltered one
  const rarityValue = document.getElementById('rarity').value;
  const typeValue = document.getElementById('type').value;
  const params = [];
  if (rarityValue) params.push('rarity=' + encodeURIComponent(rarityValue));
  if (typeValue) params.push('type=' + encodeURIComponent(typeValue));
  const url = '/api/deals' + (params.length ? '?' + params.join('&') : '');
  try {
    const res = await fetch(url, ctrl ? { signal: ctrl.signal } : {});
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    allItems = data.items || [];
    populateRarityFilter(data.rarityCounts);
    populateTypeCounts(data.typeCounts);
    setStatus(data);
    render();
    const anyUp = Object.values(data.sources).some(s => s.enabled !== false && s.ok);
    if (!anyUp) retrySoon(60000);
  } catch (e) {
    statusData = null; // stop the age ticker from overwriting this message
    el.textContent = 'OFFLINE - server unreachable, retrying in 60s';
    el.className = 'down';
    retrySoon(60000);
  } finally {
    clearTimeout(slowNote);
    if (abortTimer) clearTimeout(abortTimer);
  }
}

// Surface any script error in the status bar so a broken browser never
// shows a silent forever-CONNECTING page
window.onerror = function (msg) {
  const el = document.getElementById('status');
  if (el) {
    el.textContent = 'PAGE ERROR - ' + msg + ' (screenshot this)';
    el.className = 'down';
  }
};
window.onunhandledrejection = function (e) {
  window.onerror(e.reason && e.reason.message ? e.reason.message : String(e.reason));
};

// Typing is debounced so phones do not re-render the grid per keystroke.
// Checkboxes and the sort select apply instantly.
let debounceTimer = null;
function filtersChanged() {
  visibleCount = PAGE_SIZE;
  render();
}
for (const id of ['search', 'minPrice', 'maxPrice']) {
  document.getElementById(id).addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(filtersChanged, 150);
  });
}
for (const id of ['crossOnly', 'imgOnly', 'sort']) {
  document.getElementById(id).addEventListener('input', filtersChanged);
}
document.getElementById('rarity').addEventListener('input', function () {
  visibleCount = PAGE_SIZE;
  load();
});
document.getElementById('type').addEventListener('input', function () {
  visibleCount = PAGE_SIZE;
  load();
});

const TYPE_LABELS = { souvenir: 'Souvenir', stattrak: 'StatTrak™', special: 'Knives and gloves', normal: 'Normal' };
function populateTypeCounts(counts) {
  if (!counts) return;
  const sel = document.getElementById('type');
  for (const opt of sel.options) {
    if (!opt.value) continue;
    const n = counts[opt.value] || 0;
    opt.textContent = `${TYPE_LABELS[opt.value]} (${n})`;
  }
}
document.getElementById('more').addEventListener('click', function () {
  visibleCount += PAGE_SIZE;
  render();
});
document.getElementById('dir').addEventListener('click', function () {
  sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  this.innerHTML = sortDir === 'desc' ? '&#8595; DESC' : '&#8593; ASC';
  filtersChanged();
});
// Tooltips do not exist on touch screens: tapping the status line shows
// the failed-source details instead
document.getElementById('status').addEventListener('click', function () {
  if (this.title) alert(this.title);
});
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
